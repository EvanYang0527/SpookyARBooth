name: Build and Deploy to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Build backend
        run: |
          cd backend
          npm ci
          npm run build
          npm prune --production

      - name: Package deployment artifact
        run: |
          mkdir -p deploy_package/backend
          cp package.json deploy_package/
          cp -r dist deploy_package/dist
          cp backend/package.json deploy_package/backend/
          cp -r backend/dist deploy_package/backend/dist
          cp -r backend/node_modules deploy_package/backend/node_modules
          cd deploy_package
          zip -r ../deployment.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deployment.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: Production
      url: ${{ steps.deploy.outputs.webapp-url }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: itstiphotobooth
          slot-name: Production
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: deployment.zip
